version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    ignore:
      # TypeScript 7's native compiler doesn't expose the programmatic API that
      # `astro check` relies on, so @astrojs/check fails on it. Stay on 6.x until
      # https://github.com/withastro/roadmap/discussions/1321 lands.
      - dependency-name: typescript
        versions: ["7.x"]
  - package-ecosystem: bundler
    directory: "/"
    schedule:
      interval: weekly
